name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Build Moodle installation ZIP
        run: bash .github/scripts/package.sh "$RELEASE_TAG"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --verify-tag --title "S3 bucket $RELEASE_TAG (custom fork)" \
              --notes "Custom repository_s3bucket for Moodle 5.1–5.2. Administrator-only file selection, inline PDF aliases, page links and routing by File activity ID number. Install the repository_s3bucket ZIP asset, which contains the s3bucket folder. See README for installation and course configuration."
          fi
